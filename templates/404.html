<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | Burnside Attendance</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">

    <style>
        .error-wrapper {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .error-content {
            width: 100%;
            max-width: 620px;
            text-align: center;
        }

        .error-number {
            margin: 0;
            font-size: clamp(7rem, 18vw, 12rem);
            line-height: .8;
            font-weight: 900;
            letter-spacing: -0.09em;
            color: var(--green);
            opacity: .95;
        }

        .error-title {
            margin: 42px 0 10px;
            font-size: 2rem;
            font-weight: 750;
            letter-spacing: -0.035em;
            color: var(--text);
        }

        .error-text {
            max-width: 450px;
            margin: 0 auto 30px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .error-actions a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 22px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 650;
            font-size: .95rem;
            transition: .2s ease;
        }

        .error-home {
            background: var(--green);
            color: white;
            box-shadow: 0 6px 18px rgba(0, 95, 2, .18);
        }

        .error-home:hover {
            background: var(--green-dark);
            transform: translateY(-1px);
        }

        .error-back {
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .error-back:hover {
            background: var(--green-light);
            border-color: #cbdcc9;
            transform: translateY(-1px);
        }

        .error-footer {
            margin-top: 42px;
            font-size: .82rem;
            color: var(--muted);
        }

        @media (max-width: 600px) {
            .error-wrapper {
                min-height: calc(100vh - 60px);
            }

            .error-number {
                font-size: 7rem;
            }

            .error-title {
                margin-top: 34px;
                font-size: 1.65rem;
            }

            .error-actions {
                flex-direction: column;
            }

            .error-actions a {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Same style of header as the rest of the website -->
    <header class="header">
        <div class="header-inner">

            <a href="/" class="brand">
                <span class="brand-icon">B</span>
                <span>Burnside Attendance</span>
            </a>

            <nav class="nav">
                <a href="/">Home</a>

                {% if session.get("username") %}
                    <a href="/my-attendance">My Attendance</a>
                {% endif %}
            </nav>

        </div>
    </header>


    <main class="error-wrapper">

        <section class="error-content">

            <p class="error-number">404</p>

            <h1 class="error-title">
                We can't find that page
            </h1>

            <p class="error-text">
                The page you're looking for doesn't exist or may have
                been moved. Let's get you back to Burnside Attendance.
            </p>

            <div class="error-actions">

                <a href="/" class="error-home">
                    ← Back to Home
                </a>

                <a href="javascript:history.back()" class="error-back">
                    Go Back
                </a>

            </div>

            <p class="error-footer">
                Burnside Attendance
            </p>

        </section>

    </main>

</body>
</html>
